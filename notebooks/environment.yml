# Conda environment for both crash-course notebooks:
#   - bess_analytics_crash_course.ipynb
#   - pv_dt_pm_crash_course.ipynb
#
# One-command setup:
#   conda env create -f notebooks/environment.yml
#   conda activate nuravolt-notebooks
#   pip install -e .          # from repo root — installs the nuravolt package
#   python -m ipykernel install --user --name nuravolt-notebooks --display-name "NuraVolt Notebooks"
#   jupyter lab notebooks/
#
# Update an existing env to match:
#   conda env update -f notebooks/environment.yml --prune

name: nuravolt-notebooks
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13

  # ----- Data wrangling -----
  - numpy>=1.24
  - pandas>=2.0
  - polars>=0.19
  - pyarrow>=14

  # ----- Plotting -----
  - plotly>=5.17
  - matplotlib>=3.7
  - seaborn>=0.12

  # ----- Notebook stack -----
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - ipykernel>=6.29
  - nbformat>=5.10
  - nbconvert>=7.16

  # ----- Solar / PV physics -----
  - pvlib>=0.11
  - scipy>=1.11

  # ----- ML stack -----
  - scikit-learn>=1.3
  - lightgbm>=4.0

  # ----- Networking -----
  - requests>=2.31
  - certifi>=2023

  # ----- Misc -----
  - python-dateutil>=2.8
  - tqdm>=4.66

  # ----- pip-only packages (not on conda-forge or version-pinned via pip) -----
  - pip
  - pip:
    - catboost>=1.2
    - shap>=0.44
