<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#ffffff"/>
  
  <!-- Background circle for sun -->
  <circle cx="16" cy="16" r="12" fill="url(#sunGradient)" opacity="0.1"/>
  
  <!-- Main sun symbol -->
  <circle cx="16" cy="16" r="6" fill="url(#sunGradient)"/>
  
  <!-- Sun rays -->
  <g stroke="url(#sunGradient)" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="4" x2="16" y2="6"/>
    <line x1="23.5" y1="8.5" x2="22.5" y2="9.5"/>
    <line x1="28" y1="16" x2="26" y2="16"/>
    <line x1="23.5" y1="23.5" x2="22.5" y2="22.5"/>
    <line x1="16" y1="28" x2="16" y2="26"/>
    <line x1="8.5" y1="23.5" x2="9.5" y2="22.5"/>
    <line x1="4" y1="16" x2="6" y2="16"/>
    <line x1="8.5" y1="8.5" x2="9.5" y2="9.5"/>
  </g>
  
  <!-- Neural network nodes -->
  <circle cx="12" cy="12" r="1" fill="url(#dataGradient)" opacity="0.8"/>
  <circle cx="20" cy="12" r="1" fill="url(#dataGradient)" opacity="0.8"/>
  <circle cx="12" cy="20" r="1" fill="url(#dataGradient)" opacity="0.8"/>
  <circle cx="20" cy="20" r="1" fill="url(#dataGradient)" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <path d="M12 12 L16 16 L20 12 M16 16 L20 20 M16 16 L12 20" 
        stroke="url(#dataGradient)" 
        stroke-width="0.8" 
        fill="none" 
        opacity="0.6"/>
</svg>