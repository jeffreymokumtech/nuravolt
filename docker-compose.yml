# Local stack: database, web app (seeded with a synthetic demo on first boot)
# and the LangGraph agent service.
#
#   docker compose up
#   open http://localhost:3000   sign in: demo@nuravolt.local / nuravolt-demo
#   agent: http://localhost:8100/healthz
#
# No external keys are required. Optional ones (an LLM endpoint for the chat
# surfaces, AWS for Bedrock, Resend, Stripe) go in .env.docker.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: nuravolt
      POSTGRES_PASSWORD: nuravolt
      POSTGRES_DB: nuravolt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuravolt -d nuravolt"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://nuravolt:nuravolt@db:5432/nuravolt
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      PYTHON: /opt/venv/bin/python
      AGENT_KEY_ENV_FILE: /run/agent/agent.env
    ports:
      - "3000:3000"
    volumes:
      - agentenv:/run/agent
    command: ["bash", "-c", "bash scripts/seed_local_demo.sh && node server.js"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/sign-in > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://nuravolt:nuravolt@db:5432/nuravolt
      MCP_URL: http://web:3000/api/mcp/mcp
      AGENT_ORG_ID: demo_org_alpha1
      AGENT_KEY_ENV_FILE: /run/agent/agent.env
    ports:
      - "8100:8100"
    volumes:
      - agentenv:/run/agent:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  agentenv:
