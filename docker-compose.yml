services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nuravolt
      POSTGRES_PASSWORD: nuravolt
      POSTGRES_DB: nuravolt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuravolt -d nuravolt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
