- id: dash-agent
  type: ui
  authed: true
  url: /chat?plant=smoke-park-one
  actions:
    - wait_for_selector: "textarea[data-chat-input='true']"
      timeout: 20000
    - wait_for_timeout: 1200
  forbid_requests: ["/data/", "/demo"]
  # Shams shares the ops chrome: switcher present, no /demo bleed.
  forbid_selectors: ['a[href^="/demo"]']
  expect_selectors: ['a[href="/dashboard/plant/smoke-park-one"]']
  max_console_errors: 0
  rubric: |
    PASS if the full-screen Shams view renders inside the ops chrome (command
    bar with the Dashboard/Shams switcher), a conversation sidebar, the Shams
    header with the plant context chip, and an empty-state or message list plus
    the input. FAIL on the old standalone white layout (no command bar), an
    upgrade lock (the smoke org is Business), or a crash.

# ------------------------------------------------------- demo / showcase regression
# Fixtures are EXPECTED here (no forbid_requests). Just confirm they still render
# and the links stay on /demo (no /dashboard bleed).
- id: demo-portfolio
  type: ui
  url: /demo/portfolio
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1200
  forbid_selectors: ['a[href^="/dashboard"]']
  allow_console_substrings: ["PopChild", "Function components cannot be given refs"]
  max_console_errors: 0
  rubric: |
    PASS if the marketing demo portfolio still renders on fixtures. FAIL on a
    crash or any /dashboard link leaking into the demo surface.

- id: showcase-overview
  type: ui
  url: /showcase/plant/helios
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1500
  forbid_selectors: ['a[href^="/dashboard"]']
  max_console_errors: 0
  rubric: |
    PASS if the showcase plant overview renders on fixtures without an error
    boundary (regression guard for the predictive_faults null crash). FAIL on
    "Something went wrong" or a console TypeError.

- id: demo-soiling-per-inverter
  type: ui
  url: /demo/plant/alpha/soiling
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 2500
  # The zone soiling map must render MEASURED per-inverter tiles (150 for
  # alpha) — this walk previously never exercised the demo plants where
  # the fleet-mean+jitter placeholder lived.
  expect_selectors: ['[data-zone-cell]']
  forbid_selectors: ['a[href^="/dashboard"]']
  allow_console_substrings: ["PopChild", "Function components cannot be given refs"]
  max_console_errors: 0
  rubric: |
    PASS if the soiling overview renders the KPI strip with real values (no
    mulberry-style placeholders), an SR forecast chart, and a zone soiling map
    with per-inverter tiles across several inverter groups; the cleaning
    optimiser panel either shows a saved optimisation or an explicit
    "run the optimiser" call-to-action. FAIL on fixture 404s, an empty zone
    map, a literal "Jun 22" optimal date, or any /dashboard link on the demo
    surface.

- id: dash-settings-integrations
  type: ui
  authed: true
  url: /dashboard/settings/integrations
  actions:
    - wait_for_selector: "input[placeholder='https://hook.example.com/nuravolt']"
      timeout: 20000
    - wait_for_timeout: 2000
  forbid_requests: ["/data/"]
  forbid_selectors: ['a[href^="/demo"]']
  max_console_errors: 0
  rubric: |
    PASS if the integrations settings page renders inside the ops chrome with
    the "Generic webhook" create form (name, endpoint URL, event checkboxes)
    and the O&M catalog cards (monday.com, TabTool, Jira, Make and Zapier),
    honest copy that the vendor cards work via the generic webhook. FAIL on an
    upgrade lock (the smoke org is Business), a crash, or any /demo link.
