# Authenticated /dashboard walk + /demo·/showcase regression.
#
# Deterministic assertions (collector sets passed/failed, no LLM needed):
#   forbid_requests   - no /data fixture fetches or /demo fetches on the real app
#   forbid_selectors  - no leaked /demo links; nav gating (wrong tabs absent)
#   expect_selectors  - nav gating (right tabs present)
#   allow_console_substrings - the framer-motion PopChild forwardRef dev warning
#                              is benign and pre-existing (untouched TicketsSection)
#
# Auth: export QA_SESSION_COOKIE (a signed-in Better Auth cookie for the org
# that owns the fixture plants). Locally:
#   COOKIE=$(curl -s -D - -o /dev/null -X POST localhost:3000/api/auth/sign-in/email \
#     -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
#     -d '{"email":"smoke@nuravolt.test","password":"smoketest-passw0rd"}' \
#     | grep -i '^set-cookie:' | sed 's/^set-cookie: //I' | cut -d';' -f1 | paste -sd';' -)
#   QA_SESSION_COOKIE="$COOKIE" npm run qa:ui
#
# Fixtures: smoke-park-one (PV, Smoke Solar Ops) + region_a-storage (BESS, same org).
# Regenerate their data with:
#   python scripts/seed_e2e_demo_data.py --plant-id smoke-park-one --operational
#   python -m nuravolt.pipeline.onboard_plant --plant-id smoke-park-one

# ------------------------------------------------------------------ dashboard
- id: dash-fleet-home
  type: ui
  authed: true
  url: /dashboard
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1200
  forbid_requests: ["/data/", "/demo"]
  forbid_selectors: ['a[href^="/demo"]']
  max_console_errors: 0
  rubric: |
    PASS if the fleet home shows a plant grid, an MW-usage meter, and an
    open-tickets KPI on live data. FAIL on an empty shell, an error boundary,
    or any /demo chrome.

- id: dash-pv-overview
  type: ui
  authed: true
  url: /dashboard/plant/smoke-park-one
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1500
  forbid_requests: ["/data/", "/demo"]
  # PV plant: nav must NOT offer Battery/Revenue; MUST offer Soiling.
  forbid_selectors:
    - 'a[href^="/demo"]'
    - 'a[href$="/smoke-park-one/bess"]'
    - 'a[href$="/smoke-park-one/revenue"]'
  expect_selectors: ['a[href$="/smoke-park-one/soiling"]']
  allow_console_substrings: ["PopChild", "Function components cannot be given refs"]
  max_console_errors: 0
  rubric: |
    PASS if the overview shows a live-power KPI, a twin expected-vs-actual chart
    (physics-v1), a soiling forecast, and per-inverter fleet health with a
    plausible (non-zero, non-100%) twin loss. FAIL on a fixture 404, empty
    charts, or a twin loss that looks like a missing-data artifact.

- id: dash-pv-soiling
  type: ui
  authed: true
  url: /dashboard/plant/smoke-park-one/soiling
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1500
  forbid_requests: ["/data/", "/demo"]
  forbid_selectors: ['a[href^="/demo"]']
  max_console_errors: 0
  rubric: |
    PASS if the soiling page shows fleet SR, estimated loss, a cleaning
    recommendation, a forecast with confidence bounds, and a per-inverter
    ranking (dirtiest first). FAIL on empty tables or a fixture 404.

