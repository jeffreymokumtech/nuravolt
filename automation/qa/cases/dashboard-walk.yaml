- id: dash-bess-overview
  type: ui
  authed: true
  url: /dashboard/plant/region_a-storage
  actions:
    - wait_for_selector: "main, [class*='ops']"
      timeout: 20000
    - wait_for_timeout: 1500
  forbid_requests: ["/data/", "/demo"]
  # BESS plant: nav must NOT offer Soiling/Faults; MUST offer Revenue/Battery.
  # The overview must not fire PV soiling/twin fetches (asset-gated).
  forbid_selectors:
    - 'a[href^="/demo"]'
    - 'a[href$="/region_a-storage/soiling"]'
    - 'a[href$="/region_a-storage/faults"]'
  expect_selectors:
    - 'a[href$="/region_a-storage/revenue"]'
    - 'a[href$="/region_a-storage/bess"]'
  max_console_errors: 0
  rubric: |
    PASS if the BESS overview shows SoH, usable capacity, and a battery-state
    panel (chemistry/power/energy/SoC) with Battery + Revenue links, and NO PV
    soiling/twin panels. FAIL if it renders PV empty-states or fetches PV
    endpoints for a battery plant.

