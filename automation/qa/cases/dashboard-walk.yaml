    - wait_for_timeout: 1800
  forbid_requests: ["/data/", "/demo"]
  forbid_selectors: ['a[href^="/demo"]']
  max_console_errors: 0
  rubric: |
    PASS if the battery page shows DB-sourced SoH, safety indicators, cycling,
    throughput and residual value. A "warranty unavailable" empty-state is
    acceptable for a synthesized asset (no warranty contract). FAIL on a
    /data soh_history 404 or a crash.

