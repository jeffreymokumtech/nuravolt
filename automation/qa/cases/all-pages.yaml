# ShamsIQ QA - full page sweep
# Covers every routable page under src/app/ that has a concrete URL
# (skips dynamic-only routes that require a real ID like blog/[articleId],
# and skips deep demo drilldowns that need inverter/mppt/string IDs).
#
# All cases share the same generic rubric so 24 rubrics don't have to be
# hand-written. If a specific page warrants tighter criteria, move it to
# smoke.yaml with a bespoke rubric.

# -------- Marketing / public landing pages --------

- id: page-home
  type: ui
  description: Landing page (/)
  url: /
  actions:
    - wait_for_selector: "h1, main, header"
      timeout: 15000
    - wait_for_timeout: 1500
  rubric: &generic_rubric |
    PASS if the screenshot shows the intended page rendered with real content
    (headings, copy, images, or interactive UI) and no error overlay, no
    "Something went wrong", no 404/500 message, no blank white page, and
    no unexpected Clerk sign-in wall on a page that should be public.
    FAIL on: blank page, full-page error overlay, 404/500 text, Next.js
    error boundary, unexpected auth redirect, or a page that is clearly the
    wrong route (e.g. the marketing homepage when the URL asks for a
    blog post).

